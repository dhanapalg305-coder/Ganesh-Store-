<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ganesh Admin</title><style>body{margin:0;font-family:Arial,sans-serif;background:#f7f3ee;color:#211b17}.wrap{max-width:1180px;margin:auto;padding:25px 18px}.card{background:#fff;border:1px solid #eadfd3;border-radius:14px;padding:18px;margin-bottom:18px;box-shadow:0 6px 25px #00000008}.login{max-width:430px;margin:10vh auto}.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:8px;font:inherit;margin:5px 0 12px;box-sizing:border-box}.btn{border:0;background:#8a3b12;color:#fff;padding:10px 14px;border-radius:8px;font-weight:800;cursor:pointer}.btn.light{background:#eee;color:#222}.btn.danger{background:#a52222}.top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0}.tab{background:#fff;border:1px solid #ddd;padding:9px 12px;border-radius:8px;font-weight:700}.tab.active{background:#8a3b12;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}.product{display:grid;grid-template-columns:110px 1fr;gap:15px;border-top:1px solid #eee;padding:16px 0}.product img{width:110px;height:110px;object-fit:cover;border-radius:10px;background:#eee}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:12px;font-weight:800;color:#70665e;display:block;margin-bottom:3px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.notice{padding:10px;background:#fff6dc;border:1px solid #eedaa2;border-radius:8px;font-size:13px}.error{color:#a52222}.success{color:#176b2b}.hidden{display:none!important}@media(max-width:700px){.grid,.row{grid-template-columns:1fr}.product{grid-template-columns:80px 1fr}.product img{width:80px;height:80px}}</style></head><body><div id="login" class="wrap login"><div class="card"><h1>🔐 Ganesh Admin</h1><p>Secure server-side dashboard</p><label class="label">Admin email</label><input id="email" class="input" type="email" autocomplete="username"><label class="label">Password</label><input id="password" class="input" type="password" autocomplete="current-password"><button class="btn" style="width:100%" onclick="login()">Sign in</button><p id="loginMsg" class="error"></p></div></div><div id="app" class="wrap hidden"><div class="top"><div><h1>Ganesh Cookware Admin</h1><p id="who"></p></div><div class="actions"><a class="btn light" href="/" target="_blank">View Store</a><button class="btn light" onclick="logout()">Log out</button></div></div><div id="msg"></div><div class="tabs"><button class="tab active" onclick="tab('products',this)">Products</button><button class="tab" onclick="tab('settings',this)">Store Settings</button></div><section id="productsTab"><div class="card"><div class="top"><h2>Products</h2><button class="btn" onclick="newProduct()">＋ Add Product</button></div><p>Change product name, picture, selling price and current market/reference price. Changes are stored in the server database.</p></div><div id="productsList"></div></section><section id="settingsTab" class="hidden"><div class="card"><h2>Store Settings</h2><div class="grid"><div><label class="label">Store name</label><input id="storeName" class="input"><label class="label">Hero title</label><input id="heroTitle" class="input"><label class="label">Hero description</label><textarea id="heroDesc" class="input" rows="4"></textarea><label class="label">Location</label><input id="location" class="input"></div><div><label class="label">WhatsApp number</label><input id="whatsapp" class="input"><label class="label">UPI ID</label><input id="upi" class="input"><label class="label">Hero picture</label><input id="heroImage" class="input" type="file" accept="image/jpeg,image/png,image/webp,image/gif"><button class="btn" onclick="saveSettings()">Save settings</button></div></div></div><div class="card"><h2>Change Admin Password</h2><div class="row"><div><label class="label">Current password</label><input id="currentPassword" class="input" type="password" autocomplete="current-password"></div><div><label class="label">New password (12+ characters)</label><input id="newPassword" class="input" type="password" autocomplete="new-password"></div></div><button class="btn" onclick="changePassword()">Change password</button></div></section></div><script>
let csrf='', editing=[];
async function api(url,opt={}){opt.headers=opt.headers||{};if(opt.body && !(opt.body instanceof FormData))opt.headers['Content-Type']='application/json';if(csrf)opt.headers['X-CSRF-Token']=csrf;const r=await fetch(url,opt);let d={};try{d=await r.json()}catch{}if(!r.ok)throw new Error(d.error||'Request failed');return d}
function msg(t,ok=false){document.getElementById('msg').innerHTML='<div class="card '+(ok?'success':'error')+'">'+esc(t)+'</div>'}function esc(s){return String(s??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
async function login(){document.getElementById('loginMsg').textContent='';try{const d=await api('/api/admin/login',{method:'POST',body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});csrf=d.csrf;document.getElementById('who').textContent='Signed in as '+d.email;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadAll()}catch(e){document.getElementById('loginMsg').textContent=e.message}}
async function loadAll(){await loadProducts();const s=await api('/api/admin/settings');for(const k of ['storeName','heroTitle','heroDesc','whatsapp','upi','location'])document.getElementById(k).value=s[k]||''}
async function loadProducts(){editing=await api('/api/admin/products');renderProducts()}
function renderProducts(){document.getElementById('productsList').innerHTML=editing.map(p=>`<div class="card"><div class="product"><img src="${esc(p.image)}" id="img-${p.id}"><div><div class="row"><div><label class="label">Product name</label><input class="input" id="name-${p.id}" value="${esc(p.name)}"></div><div><label class="label">Category</label><input class="input" id="cat-${p.id}" value="${esc(p.category)}"></div></div><div class="row"><div><label class="label">Selling price (₹)</label><input class="input" type="number" min="0" id="price-${p.id}" value="${p.price}"></div><div><label class="label">Current market/reference price (₹)</label><input class="input" type="number" min="0" id="market-${p.id}" value="${p.marketPrice}"></div></div><label class="label">Description</label><textarea class="input" id="desc-${p.id}" rows="2">${esc(p.description)}</textarea><label class="label">Product picture</label><input class="input" type="file" id="file-${p.id}" accept="image/jpeg,image/png,image/webp,image/gif"><div class="actions"><button class="btn" onclick="saveProduct(${p.id})">Save changes</button><button class="btn danger" onclick="deleteProduct(${p.id})">Delete</button></div></div></div></div>`).join('')}
async function saveProduct(id){try{const f=new FormData();f.append('name',document.getElementById('name-'+id).value);f.append('category',document.getElementById('cat-'+id).value);f.append('price',document.getElementById('price-'+id).value);f.append('marketPrice',document.getElementById('market-'+id).value);f.append('description',document.getElementById('desc-'+id).value);const file=document.getElementById('file-'+id).files[0];if(file)f.append('image',file);await api('/api/admin/products/'+id,{method:'PUT',body:f});msg('Product saved.',true);await loadProducts()}catch(e){msg(e.message)}}
async function newProduct(){try{const f=new FormData();f.append('name','New Product');f.append('category','GANESH');f.append('description','');f.append('price','0');f.append('marketPrice','0');await api('/api/admin/products',{method:'POST',body:f});msg('Product created.',true);await loadProducts()}catch(e){msg(e.message)}}
async function deleteProduct(id){if(!confirm('Delete this product?'))return;try{await api('/api/admin/products/'+id,{method:'DELETE'});msg('Product deleted.',true);await loadProducts()}catch(e){msg(e.message)}}
async function saveSettings(){try{const f=document.getElementById('heroImage').files[0];const body={storeName:document.getElementById('storeName').value,heroTitle:document.getElementById('heroTitle').value,heroDesc:document.getElementById('heroDesc').value,whatsapp:document.getElementById('whatsapp').value,upi:document.getElementById('upi').value,location:document.getElementById('location').value};await api('/api/admin/settings',{method:'PUT',body:JSON.stringify(body)});if(f){const fd=new FormData();fd.append('image',f);await api('/api/admin/settings/hero-image',{method:'POST',body:fd})}msg('Store settings saved.',true)}catch(e){msg(e.message)}}
function tab(name,b){document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.getElementById('productsTab').classList.toggle('hidden',name!=='products');document.getElementById('settingsTab').classList.toggle('hidden',name!=='settings')}
async function changePassword(){try{await api('/api/admin/password',{method:'POST',body:JSON.stringify({currentPassword:document.getElementById('currentPassword').value,newPassword:document.getElementById('newPassword').value})});alert('Password changed. Please sign in again.');location.reload()}catch(e){msg(e.message)}}
async function logout(){try{await api('/api/admin/logout',{method:'POST'})}finally{location.reload()}}
(async()=>{try{const m=await api('/api/admin/me');const c=await api('/api/admin/csrf');csrf=c.token;document.getElementById('who').textContent='Signed in as '+m.email;document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');await loadAll()}catch{}})();
</script></body></html>
